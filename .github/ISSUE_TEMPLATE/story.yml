name: Story
description: A piece of work to be done
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: As a …
      placeholder: "As a [who], I want [what], so that [why]."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else worth knowing.
